[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "realsrv-test"
version = "0.1.0"
description = "Installable CLI that runs the code-analysis-server live acceptance pipeline"
requires-python = ">=3.10"
authors = [
    { name = "Vasiliy Zdanovskiy", email = "vasilyvz@gmail.com" },
]
dependencies = [
    "code-analysis-client>=1.0.26",
]

# No [project.scripts] here: the standing contract mandates exactly ONE
# verification runner (`pipeline`, code_analysis/pipeline_cli.py). This
# package stays installable as a library only -- the pipeline's
# scripts/verify_client_all_commands_live.py shim imports `realsrv_test`
# directly. A second console script here would be a competing runner; a
# missing check belongs in pipeline_cli.py as a new named check instead.

[tool.setuptools.packages.find]
where = ["."]
include = ["realsrv_test*"]
